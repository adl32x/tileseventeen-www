<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tile Seventeen</title>
<meta name="description" content="Tile Seventeen, an independent game studio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Micro+5&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #ffffff;
    color: #000000;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .logo {
    text-align: center;
    font-family: "Micro 5", monospace;
  }
  .tile {
    display: block;
    font-size: clamp(4rem, 16vw, 12rem);
    line-height: 1;
  }
  h1 {
    margin: 0;
    padding: 0 16px;
    font-family: "Micro 5", monospace;
    font-weight: 400;
    font-size: clamp(3rem, 12vw, 9rem);
    line-height: 1;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="logo">
    <span class="tile" aria-hidden="true">■</span>
    <h1>tile seventeen</h1>
  </div>
</body>
</html>
